version: 0.1.0
publish_to: none

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.18.3
  url_launcher: ^6.3.2
  rar_design_system:
    path: ../rar_design_system

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
