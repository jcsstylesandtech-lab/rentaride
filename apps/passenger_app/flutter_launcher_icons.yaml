# Regenerate app icons with: dart run flutter_launcher_icons
# Sources are built from brand/tools/build_logo.py.
flutter_launcher_icons:
  image_path: "../../brand/png/app_icon_1024.png"
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#061B49"
  adaptive_icon_foreground: "../../brand/png/adaptive_foreground_1024.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "../../brand/png/app_icon_1024.png"
    background_color: "#061B49"
    theme_color: "#061B49"
